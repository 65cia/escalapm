<body><div class="w" id="app"></div>
<script>
// ===== CONFIGURAÇÃO =====
const PLANILHA_ID="1qY6dfCt804Lwih-8Q44Po1nxcuBfHcndQKSp74e7MAQ";
const CHAVE_API="AIzaSyCI-vebKL9GUe7ubcAFf3Iu0LaX_I7uqzI"; // troque por uma chave restrita ao seu site (veja as instruções)
const WHATSAPP="5532991533066";
const HORAS_ID="1qhNpc39S9JZ3lSVudFBQUAM_jDIjgqGpkMtTzUw8s0Y"; // controle de carga horária (1ª aba: col. B = Nº Polícia, col. E = saldo)
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const CID=[["ITAVERAVA","Itaverava",["ITAVERAVA"],1,"ITA"],["CAN","Catas Altas da Noruega",["CATAS ALTAS","CAN","NORUEGA","NORUEGUA"],1,"CAN"],["LAMIM","Lamim",["LAMIM"],1,"LAM"],["RIO_ESPERA","Rio Espera",["RIO ESPERA","RIO ESP"],1,"RIO"],["OURO_BRANCO","Ouro Branco",["OURO BRANCO"],0,"OB"]].map(([k,n,a,c,s])=>({k,n,a,c,s}));
const FOLGAS=["FO","RC"],AFAST=["FA","LM","FD","FP","DD","TR","CS"];
const RH=/(\d{1,2})\s*(?:H|:)?\s*(\d{2})?\s*(?:MIN)?\s*(?:AS|ÀS|À|-|–)\s*\d/i;

// ===== TEXTO =====
const norm=t=>(t||"").normalize("NFD").replace(/\p{M}+/gu,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
const esc=t=>(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cidades=t=>{const s=" "+norm(t)+" ";return CID.filter(c=>c.a.some(a=>s.includes(" "+a+" ")))};
const MN=MESES.map(norm);
function mesTxt(t){for(const tk of norm(t).split(" "))for(let i=0;i<12;i++){const c=MN[i],a=c.slice(0,3);if(tk===c||tk===a)return i+1;if(tk.length>3&&tk.startsWith(a)&&/^\d+$/.test(tk.slice(3)))return i+1}return null}
const anoTxt=t=>{const m=/(20\d{2})/.exec(t);return m?+m[1]:null};
const ehCodigo=t=>/^[A-Z]{1,4}\d{0,3}$/.test((t||"").trim().toUpperCase());
const limpar=t=>(t||"").trim().replace(/\s+/g," ");
const fmtPm=p=>p.length===7?`${p.slice(0,3)}.${p.slice(3,6)}-${p[6]}`:p;
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const p2=n=>String(n).padStart(2,"0");

function elegivel(t){if(!cidades(t).length)return false;const n=" "+norm(t)+" ";return!["COPIA","NAO VALIDA","MOV"].some(x=>n.includes(" "+x+" "))}
function recente(t){ // ignora abas antigas pelo título (só para baixar menos dados)
  const m=mesTxt(t);if(!m)return true;let y=anoTxt(t);
  if(!y){const k=/(?:^| |[A-Z])(2[4-9])(?!\d)/.exec(norm(t));if(k)y=2000+ +k[1]}
  if(!y)return true;const h=new Date();return y*12+m>=h.getFullYear()*12+h.getMonth()+1-3}

// ===== LEITURA DAS ABAS =====
function grade(s){const g=[],notas={};for(const b of s.data||[])(b.rowData||[]).forEach((r,i)=>{const l=[];(r.values||[]).forEach((c,j)=>{l[j]=(c.formattedValue||"").trim();if(c.note)notas[i+","+j]=c.note.trim()});g[(b.startRow||0)+i]=l});return{g:Array.from(g,r=>r||[]),notas}}

function interpretar(g,nome,notas){
  const idx=g.findIndex(l=>l.some(x=>norm(x)==="N PM"));if(idx<0)return null;
  const cab=g[idx],f=n=>cab.findIndex(x=>norm(x)===n);
  const cPm=f("N PM"),cG=f("P G"),cN=f("MILITAR");if(cPm<0||cG<0||cN<0)return null;
  let c1=-1,ld=-1;
  for(const k of [idx-1,idx,idx-2,idx+1]){const l=g[k];if(!l)continue;
    for(let j=cN+1;j<l.length-1;j++)if((l[j]||"").trim()==="1"&&(l[j+1]||"").trim()==="2"){c1=j;break}
    if(c1>=0){ld=k;break}}
  if(c1<0)return null;
  let nd=0;while(c1+nd<g[ld].length&&(g[ld][c1+nd]||"").trim()===String(nd+1))nd++;
  let tit="";for(let i=0;i<idx&&!tit;i++)for(const c of g[i])if(!tit&&norm(c).includes("ESCALA"))tit=c;
  const mes=mesTxt(tit)||mesTxt(nome);if(!mes)return null;
  const ano=anoTxt(tit)||anoTxt(nome)||new Date().getFullYear();
  nd=Math.min(nd,new Date(ano,mes,0).getDate());if(nd<28)return null;
  let cs=cidades(nome);if(cs.length!==1){const t=cidades(tit);if(t.length===1)cs=t}
  const previa=norm(nome).split(" ").includes("PREVIA");
  const mil=[];let iLeg=g.length;
  for(let i=idx+1;i<g.length;i++){const l=g[i];
    if(l.some(x=>norm(x)==="LEGENDA")){iLeg=i;break}
    const pm=(l[cPm]||"").replace(/\D/g,"");
    if(pm.length>=6)mil.push({pm,grad:limpar(l[cG]),nome:limpar(l[cN]),dias:Array.from({length:nd},(_,k)=>(l[c1+k]||"").trim()),linha:i});
    else if(ehCodigo(l[cG])&&(l[cN]||"").trim()){iLeg=i-1;break}}
  const leg={},cat={};let inv=0;
  for(let i=iLeg+1;i<g.length;i++){const l=g[i],c=(l[cG]||"").trim().toUpperCase();
    if(ehCodigo(c)){inv=0;leg[c]=(l[cN]||"").trim();const k=cG>=1?(l[cG-1]||"").trim():"";if(["DIA","NOITE","NEUTRO"].includes(norm(k)))cat[c]=k}
    else if(++inv>=3)break}
  return{cid:cs[0]||null,ano,mes,previa,nome,mil,leg,cat,c1,notas}
}

const dias=(a,m)=>{let mk=null;return m.dias.map(c=>{if(!c)return["",mk];const u=c.toUpperCase();if(u in a.leg){mk=null;return[u,null]}const ci=cidades(c)[0]||CID.find(x=>x.s===norm(c));if(ci){mk=ci;return["",ci]}mk=null;return[u,null]})};

function montar(abas,pm){
  const cp=abas.map(a=>[a,a.mil.find(m=>m.pm===pm)]).filter(p=>p[1]);if(!cp.length)return null;
  const cheios=p=>dias(...p).filter(x=>x[0]).length;
  const prin=cp.reduce((b,p)=>cheios(p)>cheios(b)?p:b);
  const[aP,mP]=prin,base=dias(aP,mP),leg={...aP.leg},cat={...aP.cat};
  const nota=(a,m,i)=>a.notas[m.linha+","+(a.c1+i)]||"";
  const out=base.map(([cod,mk],i)=>{
    if(!mk)return{c:cod,o:"",n:nota(aP,mP,i)};
    const alvo=cp.find(p=>p[0]!==aP&&p[0].cid&&p[0].cid.k===mk.k);
    const c2=alvo?(dias(...alvo)[i]||[""])[0]:"";
    if(!c2)return{c:"",o:mk.n,n:""};
    if(alvo[0].leg[c2]&&!(c2 in leg))leg[c2]=alvo[0].leg[c2];
    if(alvo[0].cat[c2]&&!(c2 in cat))cat[c2]=alvo[0].cat[c2];
    return{c:c2,o:mk.n,n:nota(alvo[0],alvo[1],i)}});
  return{ano:aP.ano,mes:aP.mes,grad:mP.grad,nome:mP.nome,cidade:aP.cid?aP.cid.n:"",dias:out,leg,cat,previa:aP.previa,
    col:aP.cid&&aP.cid.c?aP.mil.map(m=>({pm:m.pm,n:m.nome,g:m.grad,c:m.dias.map(x=>x.toUpperCase()),eu:m.pm===pm})):[]};
}

function montarCidade(a){return{ano:a.ano,mes:a.mes,grad:"",nome:"",cidade:a.cid.n,dias:[],leg:a.leg,cat:a.cat,previa:a.previa,
  col:a.mil.map(m=>({pm:m.pm,n:m.nome,g:m.grad,c:m.dias.map(x=>x.toUpperCase()),eu:false}))}}
function escolher(lidas){const gr={};for(const a of lidas)(gr[`${a.cid&&a.cid.k}-${a.ano}-${a.mes}`]??=[]).push(a);
  const nota=a=>{const n=" "+norm(a.nome)+" ";return n.includes(" ANTIGA ")?0:n.includes(" ATUALIZ")?2:1};
  return Object.values(gr).map(g=>g.reduce((b,a)=>nota(a)>nota(b)?a:b))}

async function api(u){const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function baixar(pm,cidK){
  const base=`https://sheets.googleapis.com/v4/spreadsheets/${PLANILHA_ID}`;
  const abas=(await api(`${base}?fields=sheets.properties(title,hidden)&key=${CHAVE_API}`)).sheets.map(s=>s.properties)
    .filter(p=>!p.hidden&&elegivel(p.title)&&recente(p.title)&&(!cidK||cidades(p.title).some(c=>c.k===cidK))).map(p=>p.title);
  const lotes=[];for(let i=0;i<abas.length;i+=6)lotes.push(abas.slice(i,i+6));
  const campos=encodeURIComponent("sheets(properties(title),data(startRow,startColumn,rowData(values(formattedValue,note))))");
  const res=await Promise.all(lotes.map(l=>api(`${base}?`+l.map(t=>"ranges="+encodeURIComponent(`'${t.replace(/'/g,"''")}'!A1:AZ150`)).join("&")+`&fields=${campos}&key=${CHAVE_API}`)));
  const folhas=res.flatMap(r=>r.sheets||[]).sort((a,b)=>abas.indexOf(a.properties.title)-abas.indexOf(b.properties.title));
  const lidas=[];for(const s of folhas){try{const{g,notas}=grade(s);const a=interpretar(g,s.properties.title,notas);if(a)lidas.push(a)}catch(e){}}
  if(cidK){const nv={};for(const a of escolher(lidas))if(a.cid&&a.cid.k===cidK)nv[a.ano*100+a.mes]=montarCidade(a);return nv}
  const porMes={};for(const a of escolher(lidas))(porMes[a.ano*100+a.mes]??=[]).push(a);
  const novos={};for(const k in porMes){const m=montar(porMes[k],pm);if(m)novos[k]=m}
  return novos}

// ===== TIPOS =====
function tipo(m,c){c=(c||"").trim().toUpperCase();if(!c)return"v";if(FOLGAS.includes(c))return"f";if(c==="PSO"||AFAST.includes(c))return"o";
  const k=norm(m.cat[c]||"");if(k==="NOITE")return"n";if(k==="NEUTRO")return"o";if(k==="DIA")return"d";

// ===== OPERAÇÕES (planilha pública, uma aba por cidade/mês) =====
const OPERACOES_PUBLICADAS_ID="2PACX-1vTOmy2u2jP6Lklna20_PhivKBpFjq9t6W3PeYcPkAX-phRvBFcIN0cCCmRtqxldjSEzEuU6MineAGqJ";
const OPERACOES_ID_REAL=""; // opcional: ID real da planilha de operações (usa a API do Google se o navegador bloquear a página publicada)
const PUB="https://docs.google.com/spreadsheets/d/e/"+OPERACOES_PUBLICADAS_ID;
const R_DATA=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/;
const R_FAIXA=/(\d{1,2})\s*(?:H|:)?\s*(\d{2})?\s*(?:MIN)?\s*(?:AS|ÀS|À|-|–)\s*(\d{1,2})\s*(?:H|:)?\s*(\d{2})?\s*(?:MIN)?/i;
const TTL_CSV=10*60*1000,TTL_ABAS=60*60*1000,TTL_FALHA=2*60*1000;
const OPC=new Map(),OPF=new Map(),OPP=new Map(),PRE={};
let ABP=null,OPID=0;

function faixaMin(t){const m=R_FAIXA.exec(t||"");if(!m)return null;
  const h1=+m[1],i1=+(m[2]||0),h2=+m[3],i2=+(m[4]||0);
  if(h1>23||h2>23||i1>59||i2>59)return null;return[h1*60+i1,h2*60+i2]}
const hm=n=>p2(Math.floor(n/60))+":"+p2(n%60);
function parseCsv(t){t=(t||"").replace(/^\uFEFF/,"");const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}
    else c+=ch}
  if(c!==""||r.length){r.push(c);rows.push(r)}return rows}
async function txt(u,ms=9000){const ct=new AbortController(),tm=setTimeout(()=>ct.abort(),ms);
  try{const r=await fetch(u,{signal:ct.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.text()}finally{clearTimeout(tm)}}
const mesmaCidade=(t,cid)=>{const n=norm(t);return!!n&&(n===norm(cid.n)||cidades(t).some(x=>x.k===cid.k))};

function nomesAba(cid,ano,mes){
  const base={ITAVERAVA:["Itaverava"],CAN:["Catas altas da Noruega","Catas Altas da Noruega"],LAMIM:["Lamim"],RIO_ESPERA:["Rio espera","Rio Espera"]}[cid.k]||[cid.n];
  const nm=MESES[mes-1],ab=nm.slice(0,3);
  return[...new Set(base.flatMap(c=>[`${c} ${nm} ${ano}`,`${c} - ${nm}/${ano}`,`${c} - ${ab} ${ano}`,`${c} ${nm}/${ano}`,`${c} - ${ab}/${ano}`,`${c} ${ab} ${ano}`]))]}

function parseOperacoes(rows,ano,mes){const out=[];
  for(const l of rows){if(!l||!l.length)continue;
    const iD=l.findIndex(x=>R_DATA.test((x||"").trim()));if(iD<0)continue;
    const iH=l.findIndex(x=>faixaMin(x)!==null);if(iH<0)continue;
    const dm=R_DATA.exec(l[iD].trim()),d=+dm[1],m=+dm[2],y=+dm[3],dt=new Date(y,m-1,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)continue;
    if(y!==ano||m!==mes)continue;
    const f=faixaMin(l[iH]);if(!f)continue;
    let iC=-1;for(let i=0;i<iD;i++)if(/^[A-Z]\d{4,6}$/.test((l[i]||"").trim().toUpperCase())){iC=i;break}
    if(iC<0)continue;
    const nome=(l[iC+1]||"").trim();if(!nome)continue;
    out.push({cidade:(l[0]||"").trim(),codigo:l[iC].trim().toUpperCase(),nome,loc:(l[iC+2]||"").trim(),area:(l[iC+3]||"").trim(),y,m,d,ini:f[0],fim:f[1],
      obs:l.slice(iH+1).join(" ").trim(),
      extra:l.slice(iC+4,iC+4+Math.max(0,iD-iC-4)).filter(x=>(x||"").trim()).join(" · ").trim()})}
  return out}

// lista de abas da planilha publicada (guardada por 1 hora)
async function abasHtml(){
  const u=PUB+"/pubhtml";
  const tent=[u,"https://corsproxy.io/?"+encodeURIComponent(u),"https://api.allorigins.win/raw?url="+encodeURIComponent(u)];
  let html="";
  for(const x of tent){try{const h=await txt(x,10000);if(/items\.push/.test(h)){html=h;break}}catch(e){}}
  const m={},re=/items\.push\(\{name:\s*"((?:\\.|[^"])*)".*?gid:\s*"(-?\d+)"/gis;
  for(const x of html.matchAll(re)){
    const t=x[1].replace(/\\\//g,"/").replace(/\\"/g,'"').replace(/\\u([0-9a-fA-F]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\x([0-9a-fA-F]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16))).trim();
    if(t)m[t]=+x[2]}
  return m}
async function abasApi(){
  const r=await api(`https://sheets.googleapis.com/v4/spreadsheets/${OPERACOES_ID_REAL}?fields=sheets.properties(title,hidden)&key=${CHAVE_API}`);
  const m={};for(const s of r.sheets||[])if(!s.properties.hidden)m[s.properties.title]=s.properties.title;return m}
function abasPublicadas(forcar){
  if(ABP)return ABP;
  ABP=(async()=>{const c=ler("opAbas",null);
    if(!forcar&&c&&c.m&&Date.now()-c.t<TTL_ABAS&&Object.keys(c.m).length)return c.m;
    let m={};try{m=OPERACOES_ID_REAL?await abasApi():await abasHtml()}catch(e){}
    if(Object.keys(m).length){gravar("opAbas",{t:Date.now(),m});return m}
    return c&&c.m?c.m:{}})();
  ABP.then(()=>{ABP=null},()=>{ABP=null});return ABP}
async function linhasDaAba(ref){
  if(OPERACOES_ID_REAL){
    const r=await api(`https://sheets.googleapis.com/v4/spreadsheets/${OPERACOES_ID_REAL}/values/${encodeURIComponent("'"+String(ref).replace(/'/g,"''")+"'!A1:AZ500")}?key=${CHAVE_API}`);
    return r.values||[]}
  const t=await txt(`${PUB}/pub?gid=${ref}&single=true&output=csv`);
  if(!t.trim()||t.trimStart().startsWith("<"))throw new Error("aba");
  return parseCsv(t)}
const erroRede=()=>new Error("Não consegui acessar a planilha de operações. Confira a internet e tente de novo.");

async function baixarLinhasOperacoes(cid,ano,mes){
  const nomes=nomesAba(cid,ano,mes);
  const achar=ab=>{
    for(const n of nomes){const t=Object.keys(ab).find(k=>norm(k)===norm(n));if(t)return t}
    return Object.keys(ab).find(k=>elegivel(k)&&cidades(k).some(x=>x.k===cid.k)&&mesTxt(k)===mes&&anoTxt(k)===ano)||null};
  let abas=await abasPublicadas(false),t=achar(abas);
  // aba não está na lista guardada: pode ter sido criada agora, atualiza a lista uma vez
  if(!t&&Date.now()-(ler("opAbas",{t:0})||{t:0}).t>TTL_FALHA){abas=await abasPublicadas(true);t=achar(abas)}
  if(t){try{return await linhasDaAba(abas[t])}catch(e){}}
  if(!Object.keys(abas).length){
    // sem lista de abas: tenta direto pelo nome (endereço alternativo)
    for(const n of nomes){try{
      const g=await txt(PUB+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(n),8000);
      if(g.trim()&&!g.trimStart().startsWith("<"))return parseCsv(g)}catch(e){}}
    throw erroRede()}
  // busca alternativa: identifica a aba pelo conteúdo da coluna A
  const cand=Object.keys(abas).filter(k=>{const m=mesTxt(k),y=anoTxt(k);return(!m||m===mes)&&(!y||y===ano)}).slice(0,15);
  const res=await Promise.allSettled(cand.map(k=>linhasDaAba(abas[k])));
  if(cand.length&&res.every(r=>r.status!=="fulfilled"))throw erroRede();
  for(const r of res){if(r.status!=="fulfilled")continue;const rows=r.value;
    if(rows.filter(l=>mesmaCidade(l[0],cid)).length<2)continue;
    if(parseOperacoes(rows,ano,mes).some(o=>mesmaCidade(o.cidade,cid)))return rows}
  const e=new Error(`A aba '${nomes[nomes.length-1]}' não foi encontrada ou não está publicada.`);e.nao=true;throw e}

// com cache: reabrir é instantâneo; também é chamada em segundo plano (pré-carregamento)
function obterLinhasOperacoes(cid,ano,mes){
  const ch=`${cid.k}|${ano}|${mes}`,ag=Date.now(),c=OPC.get(ch);
  if(c&&ag-c.t<TTL_CSV)return Promise.resolve(c.r);
  const f=OPF.get(ch);if(f&&ag-f.t<TTL_FALHA)return Promise.reject(new Error(f.m));
  if(OPP.has(ch))return OPP.get(ch);
  const p=(async()=>{try{const r=await baixarLinhasOperacoes(cid,ano,mes);OPC.set(ch,{t:Date.now(),r});OPF.delete(ch);return r}
    catch(e){if(e.nao){OPF.set(ch,{t:Date.now(),m:e.message});throw e}if(c)return c.r;throw e.message&&e.message.startsWith("Não consegui")?e:erroRede()}})();
  OPP.set(ch,p);p.then(()=>OPP.delete(ch),()=>OPP.delete(ch));return p}

async function consultarOps(modo,cid,ano,mes,dia,desc){
  const rows=await obterLinhasOperacoes(cid,ano,mes);
  let todas=parseOperacoes(rows,ano,mes).filter(o=>mesmaCidade(o.cidade,cid)),r;
  if(modo==="d")r=todas.filter(o=>o.d===dia); // modo cidade: todas as operações do dia
  else{
    const f=faixaMin(desc);if(!f)throw new Error("Não foi possível identificar o horário de início e término deste turno.");
    const vira=f[1]<=f[0];
    if(vira&&dia===new Date(ano,mes,0).getDate()){ // turno da noite no último dia do mês: operações da madrugada estão na aba do mês seguinte
      const p=new Date(ano,mes,1),y2=p.getFullYear(),m2=p.getMonth()+1;
      try{const r2=await obterLinhasOperacoes(cid,y2,m2);todas=todas.concat(parseOperacoes(r2,y2,m2).filter(o=>mesmaCidade(o.cidade,cid)))}catch(e){}}
    const ini=new Date(ano,mes-1,dia,0,f[0]).getTime(),fim=new Date(ano,mes-1,dia+(vira?1:0),0,f[1]).getTime();
    r=todas.filter(o=>{const t=new Date(o.y,o.m-1,o.d,0,o.ini).getTime();return t>=ini&&t<fim})}
  return r.sort((a,b)=>a.y-b.y||a.m-b.m||a.d-b.d||a.ini-b.ini||a.codigo.localeCompare(b.codigo))}

async function abrirOps(modo,k,dia,cod){
  const cid=CID.find(c=>c.k===k);if(!cid)return;
  const id=++OPID,y=Math.floor(S.vis/100),mo=S.vis%100,M=S.meses[S.vis];
  const sub=modo==="d"?`Todas as operações de ${p2(dia)}/${p2(mo)}/${y}`:`Turno ${cod} · dia ${p2(dia)}/${p2(mo)}/${y}`;
  S.op={id,modo,cidade:cid.n,sub,carregando:true,erro:null,lista:[]};desenhar();
  try{const l=await consultarOps(modo,cid,y,mo,dia,M?descr(M,cod||""):"");if(!S.op||S.op.id!==id)return;S.op.lista=l}
  catch(e){if(!S.op||S.op.id!==id)return;S.op.erro=e.message||"Não foi possível consultar as operações."}
  S.op.carregando=false;desenhar()}

// militares de serviço na hora da operação (inclui o turno da noite que começou no dia anterior)
function candidatosOp(x){

  const Mx=S.meses[x.y*100+x.m]||S.meses[S.vis];

  return `<h3>Gerar operação</h3><div class="sub2">${esc(x.codigo)} · ${esc(x.nome)}</div>
  <div class="sub2" style="margin-top:8px"><b>Endereço da operação</b></div>
  <input class="t2" id="end" type="text" autocomplete="off" placeholder="Ex.: Rua Francisco Coleta, nº 178" value="${esc(g.end)}" oninput="S.op.gen.end=this.value;this.style.borderColor='';atualizarPrev()" onkeydown="if(event.key==='Enter')enviarWa()">
  <div class="sub2" style="margin-top:12px"><b>Integrar para:</b></div>
  ${g.cands.length?g.cands.map(p=>`<label class="ck"><input type="radio" name="pmsel" ${g.pm===p.pm?"checked":""} onchange="escolherPm('${p.pm}')"><span>${esc(p.g)} ${esc(p.n)} · ${fmtPm(p.pm)}${p.eu?" (você)":""}</span></label>`).join(""):`<p class="sub2">Nenhum militar identificado neste turno.</p>`}
  <div class="sub2" style="margin-top:12px"><b>Mensagem</b> (será enviada para o WhatsApp (${esc(n.slice(0,2))}) ${esc(n.slice(2))})</div><div class="prev" id="prev">${esc(textoGen())}</div>
  <button class="p" onclick="enviarWa()">Abrir no WhatsApp</button><button class="p s" onclick="S.op.gen=null;desenhar()">‹ Voltar às operações</button>`}
function enviarWa(){
  const g=S.op.gen,end=(g.end||"").trim();
  if(!end){const e=document.getElementById("end");e.style.borderColor="#B3261E";e.focus();return}
  const x=S.op.lista[g.i],u=`https://wa.me/${WHATS_ADM}?text=${encodeURIComponent(msgOperacao(x,g.pm,end))}`;
  if(!window.open(u,"_blank"))location.href=u;
  GER[chaveGer(x)]=Date.now();
  const lim=Date.now()-90*864e5;for(const k in GER)if(GER[k]<lim)delete GER[k];
  gravar("gerados",GER);S.op.gen=null;desenhar()}
// baixa as operações em segundo plano para o botão abrir na hora
function preCarregar(){
  if(S.op||S.vis==null)return;const M=S.meses[S.vis];if(!M)return;
  let cid=null;
  if(S.cid)cid=CID.find(c=>c.k===S.cid);
  else{const dd=M.dias[S.sel-1];if(dd&&dd.c&&ehTurno(M,dd.c))cid=CID.find(c=>c.n===(dd.o||M.cidade))}
  if(!cid||!cid.c)return;
  const y=Math.floor(S.vis/100),mo=S.vis%100,ch=`${cid.k}|${y}|${mo}`;
  if(PRE[ch]&&Date.now()-PRE[ch]<TTL_FALHA)return;PRE[ch]=Date.now();
  obterLinhasOperacoes(cid,y,mo).catch(()=>{})}
function desenhar(){desenharBase();if(S.evf)document.getElementById("app").insertAdjacentHTML("beforeend",modalEv());if(S.op)document.getElementById("app").insertAdjacentHTML("beforeend",modalOps());preCarregar()}

// ===== INÍCIO =====
document.getElementById("icone").href = "./logo.png";
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.op)fecharOps()});
desenhar();atualizar();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-S.ult>5*60*1000)atualizar()});
window.addEventListener("focus",()=>{if(Date.now()-S.ult>5*60*1000)atualizar()});
setInterval(()=>{if(!document.hidden)atualizar()},15*60*1000);
</script>
